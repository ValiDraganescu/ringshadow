[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Ringshadow
; The game window's title (FApp's project name, the uproject's Autocraft, otherwise).
ProjectDisplayedTitle=INVTEXT("Ringshadow")
Description=Ringshadow: the RTS of prospectors on a frontier world, remade in Unreal.
CopyrightNotice=

[/Script/UnrealEd.ProjectPackagingSettings]
+MapsToCook=(FilePath="/Game/Maps/Battlefield")
; The game loads most assets by path at run time (ModelCatalog.json,
; Sounds.json, the code's /Game/... paths), which the cook cannot follow from
; the map: every folder it reads goes in whole. Without them a package cooked
; 501 packages (engine ones included) while Content holds 2727 assets, 2361
; of them models: no unit meshes (2026-10-09).
+DirectoriesToAlwaysCook=(Path="/Game/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/Effects")
+DirectoriesToAlwaysCook=(Path="/Game/Fog")
+DirectoriesToAlwaysCook=(Path="/Game/Input")
+DirectoriesToAlwaysCook=(Path="/Game/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/Models")
+DirectoriesToAlwaysCook=(Path="/Game/Pilot")
+DirectoriesToAlwaysCook=(Path="/Game/Sky")
+DirectoriesToAlwaysCook=(Path="/Game/Terrain")
+DirectoriesToAlwaysCook=(Path="/Game/UI")
; K3: rain, lens rain and the lightning bolt (AcWeather.cpp), loaded by path.
+DirectoriesToAlwaysCook=(Path="/Game/Weather")
; C5: wreck triangles baked by an editor run (AcShatter.cpp), read by a
; cooked game, which has no mesh source data to cut.
+DirectoriesToAlwaysStageAsUFS=(Path="Shatter")

[/Script/Engine.AssetManagerSettings]
; An enabled plugin pulls in GameFeatures, which logs an error (and fails
; every commandlet) without this rule. There are no game features. The rule
; is keyed by the type's name; its class is the engine's PrimaryDataAsset
; because a packaged game has no GameFeatures module, and the class it could
; not load fired an ensure at every start (K3).
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/Engine.PrimaryDataAsset",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
