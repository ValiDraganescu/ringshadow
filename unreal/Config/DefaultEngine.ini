bAllowHotReloadFromIDE=False

[SystemSettings]
; P2 (GPU, 2026-10-05): the 60 fps budget at 5120x1378 on the M4 Max. Each
; was measured interleaved against the one before (`bench.py --gpu
; --variant`) and checked side by side at 5K (scratchpad ue/p2gpu). These
; override the scalability levels (sg.* = Epic). The auto screen percentage
; (r.ScreenPercentage.Default.Desktop.Mode) already renders 5K at ~52%.
; TSR history at the output size, not 2x it (Epic's 200 makes a
; 10240x2756 history at 5K): -2 ms in a fight, no visible change.
r.TSR.History.ScreenPercentage=100
r.TSR.History.UpdateQuality=2
; The volumetric clouds' view rays: at most 96 steps (default 768, clamped
; by distance). P2 (2026-10-05) set 32 for the engine's clouds; our own
; cloud material (2026-10-12) at 32 is grainy (the eroded edges are under
; a step apart), at 64 a little, at 96 smooth. `CloudView` in the pilot
; bench shot at 5120x1378: 0.55 ms at 32, ~1.0 at 64, 1.2-1.75 at 96-128;
; nothing top down (the RTS camera never sees the sky).
r.VolumetricCloud.ViewRaySampleMaxCount=96
; ...spread over 2 km of ray (default 15): at 15 a step is ~156 m, so a ray
; up through the 3.4 km layer got ~20 samples and every cloud edge landed
; at a different step per pixel, a salt-and-pepper fuzz. At 2 the edges are
; clean; the pilot bench's cloud pass 2.06 -> 2.09 ms (long, low rays
; still spread their 96 samples over their length).
r.VolumetricCloud.DistanceToSampleMaxCount=2
; Clouds traced at half resolution and upsampled (mode 1). Mode 0 (the
; engine's default: quarter resolution rebuilt over frames) left every
; cloud's edge stair-stepped in the pilot's view, the "pixelated clouds" of
; the first-hour review (docs/mmorpg-m6.md V2; side by side in
; unreal/server/build/shots/v2, 2026-10-14). Mode 1 has no rebuild: the
; engine moves each ray's start every frame (an 8-frame blue noise), which
; showed as single traced pixels popping on bright edges in motion, ~56 per
; 10k cloud pixels a frame against ~8 in mode 0 (hidden 30 fps clips,
; 2026-10-12), and it cost ~0.6 ms more in the pilot bench. Mode 2 (quarter
; resolution rebuilt at full) was grainier still.
r.VolumetricRenderTarget.Mode=1
; Clouds in the real-time sky-light capture at a quarter (default half)
; resolution; and one capture face a frame (default 2): -0.6 ms.
r.SkyLight.RealTimeReflectionCapture.VolumetricCloudResolutionDivider=4
r.SkyLight.RealTimeReflectionCapture.TimeSlice.SkyCloudCubeFacePerFrame=1
; Lumen screen probes every 32 pixels (High; Epic 16) and the volumetric
; fog grid at 16 pixels (High; Epic 8): ~-0.8 ms together, the same frames
; at 5K. Units stay out of the distance-field scene (ac.RenderUnitDistanceFields).
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.VolumetricFog.GridPixelSize=16
; Lumen's surface cache captures at most 100 cards a frame (Epic 300): at a
; seamless region change (W4) the new region's things come into its scene at
; once and their captures took one GPU frame +3.75 ms (K3, 2026-10-15, a GPU
; trace of the crossing: LumenSceneUpdate 4.45 ms against 0.71); spread over
; three frames the crossing holds its frame time, the new surfaces lit a
; couple of frames later.
r.LumenScene.SurfaceCache.CardCapturesPerFrame=100

[Audio]
; Keep playing when the window loses focus (the engine default 0 mutes it); the game only falls quiet when paused.
UnfocusedVolumeMultiplier=1.0
