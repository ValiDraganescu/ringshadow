# Cloudflare: the Ringshadow website, served as static assets by a Worker
# (Cloudflare now runs new Pages projects as Workers). No build step: this
# folder is the site, and src/worker.js stands in front of it. Deploy: see
# README.md.
name = "ringshadow"
main = "src/worker.js"
compatibility_date = "2026-10-15"
# Only ringshadow.com serves the site: no workers.dev address, no preview URLs.
workers_dev = false
preview_urls = false

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Pictures, fonts, CSS and JS go straight to the assets; everything else
# (pages, the feed, the text files) runs through the Worker.
run_worker_first = ["/*", "!/assets/*", "!/blog/media/*"]

# One point per page, feed, text or Markdown fetch (src/hits.js).
[[analytics_engine_datasets]]
binding = "HITS"
dataset = "ringshadow_hits"

# The admin's own tables: admins, sessions, lockouts, agent labels, rollups.
[[d1_databases]]
binding = "ADMIN"
database_name = "ringshadow-admin"
database_id = "b342d584-6121-41c3-b627-827eb4d9fad3"
migrations_dir = "migrations"

[[routes]]
pattern = "ringshadow.com"
custom_domain = true
